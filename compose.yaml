services:
  fiftyapi:
    build:
      context: .
      args:
        GOPROXY: "${GOPROXY:-https://proxy.golang.org,direct}"
    image: "${FIFTYAPI_IMAGE:-fiftyapi:local}"
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      FIFTYAPI_MASTER_KEY: "${FIFTYAPI_MASTER_KEY-}"
      FIFTYAPI_DB_PATH: "${FIFTYAPI_DB_PATH-}"
      FIFTYAPI_SETUP_TOKEN: "${FIFTYAPI_SETUP_TOKEN-}"
      FIFTYAPI_COOKIE_SECURE: "${FIFTYAPI_COOKIE_SECURE-false}"
      TZ: "${TZ:-Asia/Shanghai}"
      FIFTYAPI_PUBLIC_URL: "${FIFTYAPI_PUBLIC_URL-}"
      FIFTYAPI_SMTP_HOST: "${FIFTYAPI_SMTP_HOST-}"
      FIFTYAPI_SMTP_PORT: "${FIFTYAPI_SMTP_PORT-587}"
      FIFTYAPI_SMTP_FROM: "${FIFTYAPI_SMTP_FROM-}"
      FIFTYAPI_SMTP_USERNAME: "${FIFTYAPI_SMTP_USERNAME-}"
      FIFTYAPI_SMTP_PASSWORD: "${FIFTYAPI_SMTP_PASSWORD-}"
      FIFTYAPI_SMTP_TLS: "${FIFTYAPI_SMTP_TLS-starttls}"
      ANTIGRAVITY_OAUTH_CLIENT_SECRET: "${ANTIGRAVITY_OAUTH_CLIENT_SECRET:-}"
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
volumes:
  data:
