name: Quality and local release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FIFTYAPI_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build binary, embedded UI and notices
        run: ./scripts/build-release.sh
      - name: Go race, backup restore and static checks
        run: |
          go test -race -timeout=3m ./...
          go vet ./...
          python3 scripts/test_export_sub2api.py
          python3 scripts/test_migrate_sub2api.py
          python3 scripts/check-source.py
      - name: Form logic tests
        run: npm --prefix web run test:unit
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser tests
        working-directory: web
        env:
          FIFTYAPI_TEST_BINARY: ${{ github.workspace }}/dist/fiftyapi
        run: npx playwright test
      - name: Verify version and checksum
        run: |
          ./dist/fiftyapi version
          cd dist
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fiftyapi-linux-amd64-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build local image
        run: docker build --build-arg BUILD_COMMIT="$GITHUB_SHA" -t fiftyapi:local .
      - name: Disposable container smoke
        run: python3 scripts/docker-smoke.py
      - name: Bind mount permissions, automatic secrets and container recreation
        run: FIFTYAPI_TEST_AUTO_SECRETS=1 FIFTYAPI_TEST_BIND_MOUNT=1 python3 scripts/docker-smoke.py
